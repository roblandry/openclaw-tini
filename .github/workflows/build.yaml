---
name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: OpenClaw image tag to wrap
        required: true
        default: 2026.4.26
      tini_version:
        description: Tini release tag
        required: true
        default: v0.19.0

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_OPENCLAW_VERSION: 2026.4.26
  DEFAULT_TINI_VERSION: v0.19.0

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Build Variables
        id: vars
        run: |
          openclaw_version="${{ inputs.openclaw_version || env.DEFAULT_OPENCLAW_VERSION }}"
          tini_version="${{ inputs.tini_version || env.DEFAULT_TINI_VERSION }}"
          {
            echo "openclaw_version=${openclaw_version}"
            echo "tini_version=${tini_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login To GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.openclaw_version }}
            type=sha,prefix=sha-

      - name: Build And Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            OPENCLAW_VERSION=${{ steps.vars.outputs.openclaw_version }}
            TINI_VERSION=${{ steps.vars.outputs.tini_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
